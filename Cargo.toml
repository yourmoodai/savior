[workspace]
members = ["crates/core", "crates/node", "crates/cli", "crates/lab", "crates/review", "tools/commit_check"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/yourmoodai/savior"
homepage = "https://github.com/yourmoodai/savior"
description = "Local offline offensive-span detection and deterministic replacement."

[workspace.dependencies]
base16ct = { version = "1.0.0", features = ["alloc"] }
savior = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# gemm 0.19 needs inlining for its runtime-dispatched FP16 kernels on generic ARM64.
[profile.dev.package.gemm-f16]
opt-level = 1

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = false
