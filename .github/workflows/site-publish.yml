name: publish site
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site.py', 'scripts/test-site.mjs', 'package*.json', 'docs/assets/savior.svg', 'docs/assets/social-preview.png', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-site
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site.yml
    with:
      test_sha: ${{ github.sha }}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
