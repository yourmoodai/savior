name: cancel failed ci siblings
on:
  workflow_run:
    workflows: [verify, commit messages, release qualification, adversarial code review]
    types: [completed]
permissions: {}
jobs:
  cancel:
    if: contains(fromJSON('["failure","timed_out","action_required","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./tools/ci/cancel_siblings.cjs')({github, context, core});
