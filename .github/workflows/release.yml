name: release
on:
  push:
    tags: ['v*']
concurrency:
  group: production-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/release/version_gate.py --tag
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          runner_label: ${{ matrix.os }}
  package:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          path: .cache/parts
      - run: python3 scripts/release/package.py assemble .cache/parts .cache/release/plugin
        env:
          SAVIOR_RELEASE_SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SAVIOR_RELEASE_SIGNING_KEY || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            .cache/release/*.zip
            .cache/release/marketplace.json
            .cache/release/SHA256SUMS
            .cache/release/runtime-*
            .cache/release/release-public.pem
  installed:
    timeout-minutes: 15
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-installed
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installed
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .cache/release
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/model-cache
      - name: publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          SAVIOR_RELEASE_SIGNING_KEY: ${{ secrets.SAVIOR_RELEASE_SIGNING_KEY }}
        run: python3 scripts/release/publish.py
  published-download:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: download published plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ github.ref_name }} --pattern 'savior-*.zip' --dir .cache/downloaded
      - name: qualify public signed downloads before marketplace promotion
        run: python scripts/release/smoke.py .cache/downloaded --download
