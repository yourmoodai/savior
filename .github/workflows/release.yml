name: release
on:
  push:
    tags: ['v*', '!v*-dev.*']
concurrency:
  group: production-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  gate:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - run: python3 scripts/release/version_gate.py --tag
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    timeout-minutes: 90
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          runner_label: ${{ matrix.os }}
  windows:
    needs: build
    uses: ./.github/workflows/verify-windows-stage.yml
    permissions:
      contents: read
      id-token: write
  package:
    timeout-minutes: 60
    needs: [build, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      WINDOWS_ARTIFACT_ID: ${{ needs.windows.outputs.artifact_id }}
      WINDOWS_RECORD_SHA256: ${{ needs.windows.outputs.record_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
      - name: require exact Windows verification outputs
        run: '[[ $WINDOWS_ARTIFACT_ID =~ ^[1-9][0-9]*$ && $WINDOWS_RECORD_SHA256 =~ ^[a-f0-9]{64}$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-x64
          path: .cache/parts/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: darwin-arm64
          path: .cache/parts/darwin-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          merge-multiple: true
          path: .cache/windows-handoff
      - run: mv -T .cache/windows-handoff/stage .cache/parts/win32-x64
      - run: docker build -f scripts/release/Dockerfile -t savior-release-tools .
      - name: sign, notarize, staple, and seal candidate
        run: python3 scripts/release/sign_ci.py
        env:
          SAVIOR_RELEASE_CONFIG: ${{ vars.SAVIOR_RELEASE_CONFIG }}
          SAVIOR_APPLE_P12_BASE64: ${{ secrets.SAVIOR_APPLE_P12_BASE64 }}
          SAVIOR_APPLE_PASSWORD_BASE64: ${{ secrets.SAVIOR_APPLE_PASSWORD_BASE64 }}
          SAVIOR_APPLE_API_BASE64: ${{ secrets.SAVIOR_APPLE_API_BASE64 }}
          SAVIOR_MANIFEST_PRIVATE_BASE64: ${{ secrets.SAVIOR_MANIFEST_PRIVATE_BASE64 }}
          SAVIOR_MANIFEST_PUBLIC_BASE64: ${{ secrets.SAVIOR_MANIFEST_PUBLIC_BASE64 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          retention-days: 30
          if-no-files-found: error
          path: |
            .cache/release/*.zip
            .cache/release/marketplace.json
            .cache/release/SHA256SUMS
            .cache/release/runtime-*
            .cache/release/release-public.pem
            .cache/release/release-envelope.*
  installed:
    timeout-minutes: 100
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-installed
        with:
          native: 'true'
        env:
          SAVIOR_RELEASE_CONFIG: ${{ vars.SAVIOR_RELEASE_CONFIG }}
          SAVIOR_RELEASE_PUBLIC_KEY: ${{ vars.SAVIOR_RELEASE_PUBLIC_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.os }}
          if-no-files-found: error
          path: .cache/release/acceptance-*.json
  compatibility:
    needs: package
    uses: ./.github/workflows/compatibility.yml
  publish:
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installed, compatibility]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .cache/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: ./.github/actions/model-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-*
          merge-multiple: true
          path: .cache/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-inventory
          path: .cache/compatibility
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compatibility-assessments-*
          path: .cache/compatibility/assessments
      - name: publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          SAVIOR_RELEASE_PUBLIC_KEY: ${{ vars.SAVIOR_RELEASE_PUBLIC_KEY }}
        run: python3 scripts/release/publish.py
  published-download:
    timeout-minutes: 15
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12.16'
          version: '0.13.9'
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/savior-python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: download published plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --dir .cache/downloaded
      - name: qualify public signed downloads before marketplace promotion
        env:
          SAVIOR_RELEASE_CONFIG: ${{ vars.SAVIOR_RELEASE_CONFIG }}
          SAVIOR_RELEASE_PUBLIC_KEY: ${{ vars.SAVIOR_RELEASE_PUBLIC_KEY }}
        run: python scripts/release/smoke.py .cache/downloaded --download --native
