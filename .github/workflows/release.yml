name: release
on:
  push:
    tags: ['v*']
concurrency:
  group: production-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  gate:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - run: python3 scripts/release/version_gate.py --tag
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    timeout-minutes: 90
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          runner_label: ${{ matrix.os }}
  package:
    timeout-minutes: 60
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .cache/parts
      - run: docker build -f scripts/release/Dockerfile -t savior-release-tools .
      - name: sign, notarize, staple, and seal candidate
        run: python3 scripts/release/sign_ci.py
        env:
          SAVIOR_RELEASE_CONFIG: ${{ vars.SAVIOR_RELEASE_CONFIG }}
          SAVIOR_APPLE_P12_BASE64: ${{ secrets.SAVIOR_APPLE_P12_BASE64 }}
          SAVIOR_APPLE_PASSWORD_BASE64: ${{ secrets.SAVIOR_APPLE_PASSWORD_BASE64 }}
          SAVIOR_APPLE_API_BASE64: ${{ secrets.SAVIOR_APPLE_API_BASE64 }}
          SAVIOR_WINDOWS_KEYSTORE_BASE64: ${{ secrets.SAVIOR_WINDOWS_KEYSTORE_BASE64 }}
          SAVIOR_WINDOWS_PASSWORD_BASE64: ${{ secrets.SAVIOR_WINDOWS_PASSWORD_BASE64 }}
          SAVIOR_WINDOWS_CA_BASE64: ${{ secrets.SAVIOR_WINDOWS_CA_BASE64 }}
          SAVIOR_TIMESTAMP_CA_BASE64: ${{ secrets.SAVIOR_TIMESTAMP_CA_BASE64 }}
          SAVIOR_MANIFEST_PRIVATE_BASE64: ${{ secrets.SAVIOR_MANIFEST_PRIVATE_BASE64 }}
          SAVIOR_MANIFEST_PUBLIC_BASE64: ${{ secrets.SAVIOR_MANIFEST_PUBLIC_BASE64 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          retention-days: 30
          if-no-files-found: error
          path: |
            .cache/release/*.zip
            .cache/release/marketplace.json
            .cache/release/SHA256SUMS
            .cache/release/runtime-*
            .cache/release/release-public.pem
            .cache/release/release-envelope.*
  installed:
    timeout-minutes: 15
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-installed
        with:
          native: 'true'
        env:
          SAVIOR_RELEASE_CONFIG: ${{ vars.SAVIOR_RELEASE_CONFIG }}
          SAVIOR_RELEASE_PUBLIC_KEY: ${{ vars.SAVIOR_RELEASE_PUBLIC_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.os }}
          if-no-files-found: error
          path: .cache/release/acceptance-*.json
  publish:
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installed
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .cache/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - uses: ./.github/actions/model-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-*
          merge-multiple: true
          path: .cache/release
      - name: publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          SAVIOR_RELEASE_PUBLIC_KEY: ${{ vars.SAVIOR_RELEASE_PUBLIC_KEY }}
        run: python3 scripts/release/publish.py
  published-download:
    timeout-minutes: 15
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: download published plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --dir .cache/downloaded
      - name: qualify public signed downloads before marketplace promotion
        env:
          SAVIOR_RELEASE_CONFIG: ${{ vars.SAVIOR_RELEASE_CONFIG }}
          SAVIOR_RELEASE_PUBLIC_KEY: ${{ vars.SAVIOR_RELEASE_PUBLIC_KEY }}
        run: python scripts/release/smoke.py .cache/downloaded --download --native
