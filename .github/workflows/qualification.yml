name: release qualification
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Generated release pull request number
        required: false
        type: string
      head_sha:
        description: Exact generated pull request head
        required: false
        type: string
concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  gate:
    outputs:
      native_required: ${{ steps.impact.outputs.native_required }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: validate pull request context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/pr_context.py
      - name: determine build impact
        id: impact
        env:
          BASE_SHA: ${{ steps.context.outputs.base }}
          HEAD_SHA: ${{ steps.context.outputs.head }}
        run: python3 scripts/release/ci_impact.py
      - run: python3 scripts/release/version_gate.py
  build:
    if: needs.gate.outputs.native_required == 'true'
    timeout-minutes: 90
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          runner_label: ${{ matrix.os }}
          run_training: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '' }}
  package:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .cache/parts
      - run: python3 scripts/release/package.py assemble .cache/parts .cache/release/plugin
        env:
          SAVIOR_RELEASE_SIGNING_KEY: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          retention-days: 7
          if-no-files-found: error
          path: |
            .cache/release/*.zip
            .cache/release/marketplace.json
            .cache/release/SHA256SUMS
            .cache/release/runtime-*
            .cache/release/release-public.pem
            .cache/release/release-envelope.*
  installed:
    timeout-minutes: 100
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-installed
  compatibility:
    needs: package
    uses: ./.github/workflows/compatibility.yml
  qualification:
    if: always()
    needs: [gate, build, package, installed, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/release/ci_impact.py qualification
