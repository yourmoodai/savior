name: release qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_sha:
        description: Commit to test; manual dispatch authorizes testing only
        required: false
        type: string
      pr_number:
        description: Pull request number
        required: false
        type: string
      head_sha:
        description: Expected pull request head commit
        required: false
        type: string
      base_sha:
        description: Expected main commit
        required: false
        type: string
  workflow_call:
    inputs:
      test_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
concurrency:
  group: qualification-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: read
env:
  VALIDATION_PR: ${{ inputs.pr_number }}
  VALIDATION_HEAD: ${{ inputs.head_sha }}
  VALIDATION_BASE: ${{ inputs.base_sha }}
  VALIDATION_TEST: ${{ inputs.test_sha }}
jobs:
  gate:
    if: inputs.test_sha != '' || github.ref == 'refs/heads/main'
    outputs:
      native_required: ${{ steps.impact.outputs.native_required }}
      linux_arm64: ${{ steps.platforms.outputs.linux_arm64 }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: validate pull request context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/pr_context.py
      - name: determine build impact
        id: impact
        env:
          BASE_SHA: ${{ steps.context.outputs.base }}
          HEAD_SHA: ${{ steps.context.outputs.head }}
        run: python3 scripts/release/ci_impact.py
      - run: python3 scripts/release/version_gate.py
      - name: read platforms from the package under test
        id: platforms
        working-directory: scripts/release
        run: |
          python3 -c 'from package import TARGETS; print("linux_arm64=" + str("linux-arm64" in TARGETS).lower())' >> "$GITHUB_OUTPUT"
  build:
    if: needs.gate.outputs.native_required == 'true'
    timeout-minutes: 90
    needs: gate
    strategy:
      fail-fast: false
      matrix: &native_platforms
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
        exclude: ${{ fromJSON(needs.gate.outputs.linux_arm64 == 'true' && '[]' || '[{"os":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: ./.github/actions/release-build
        with:
          target: >-
            ${{ fromJSON('{"macos-15":"darwin-arm64","ubuntu-24.04":"linux-x64",
            "ubuntu-24.04-arm":"linux-arm64","windows-2022":"win32-x64"}')[matrix.os] }}
          runner_label: ${{ matrix.os }}
          run_training: ${{ github.event_name == 'workflow_dispatch' && inputs.test_sha == '' }}
  package:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .cache/parts
      - run: python3 scripts/release/package.py assemble .cache/parts .cache/release/plugin
        env:
          SAVIOR_RELEASE_SIGNING_KEY: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          retention-days: 7
          if-no-files-found: error
          path: |
            .cache/release/*.zip
            .cache/release/marketplace.json
            .cache/release/SHA256SUMS
            .cache/release/runtime-*
            .cache/release/release-public.pem
            .cache/release/release-envelope.*
  installed:
    timeout-minutes: 100
    needs: [gate, package]
    strategy:
      fail-fast: false
      matrix: *native_platforms
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: ./.github/actions/release-installed
  compatibility:
    needs: package
    uses: ./.github/workflows/compatibility.yml
    with:
      test_sha: ${{ inputs.test_sha || github.sha }}
  qualification:
    if: always()
    needs: [gate, build, package, installed, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/release/ci_impact.py qualification
