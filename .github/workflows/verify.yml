name: verify
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Generated release pull request number
        required: false
        type: string
      head_sha:
        description: Exact generated pull request head
        required: false
        type: string
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  context:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: validate pull request context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/pr_context.py
  tooling:
    timeout-minutes: 15
    needs: context
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-branding.mjs
      - run: python3 -m unittest discover -s tools/adversarial_reviewer
      - run: python3 -m unittest discover -s scripts/release
      - run: python3 scripts/release/lint_workflows.py
  coreml:
    timeout-minutes: 30
    needs: context
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - name: restore rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coreml-macos-15-${{ runner.arch }}
          cache-on-failure: true
      - name: native build
        run: cargo clippy --locked -p savior --features coreml --all-targets -- -D warnings
      - run: cargo test --locked -p savior --features coreml
      - name: summarize cache measurements
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_GROUP: coreml-macos-15-${{ runner.arch }}
          CACHE_JOB: coreml
        with:
          script: |
            await require('./scripts/release/cache-summary.cjs')({github, context, core});
