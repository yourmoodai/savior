name: verify
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_transport_only:
        description: Run only the Windows worker transport regression
        type: boolean
        default: false
      test_sha:
        description: Commit to test; manual dispatch authorizes testing only
        required: false
        type: string
      pr_number:
        description: Pull request number
        required: false
        type: string
      head_sha:
        description: Expected pull request head commit
        required: false
        type: string
      base_sha:
        description: Expected main commit
        required: false
        type: string
  workflow_call:
    inputs:
      test_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
concurrency:
  group: verify-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: read
env:
  VALIDATION_PR: ${{ inputs.pr_number }}
  VALIDATION_HEAD: ${{ inputs.head_sha }}
  VALIDATION_BASE: ${{ inputs.base_sha }}
  VALIDATION_TEST: ${{ inputs.test_sha }}
jobs:
  context:
    if: inputs.test_sha != '' || github.ref == 'refs/heads/main'
    outputs:
      native_required: ${{ steps.impact.outputs.native_required }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: validate pull request context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/pr_context.py
      - name: determine build impact
        id: impact
        env:
          BASE_SHA: ${{ steps.context.outputs.base }}
          HEAD_SHA: ${{ steps.context.outputs.head }}
        run: python3 scripts/release/ci_impact.py
  security:
    if: inputs.windows_transport_only != true
    needs: context
    uses: ./.github/workflows/security.yml
    with:
      test_sha: ${{ inputs.test_sha || github.sha }}
  tooling:
    if: inputs.windows_transport_only != true
    timeout-minutes: 15
    needs: context
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-branding.mjs
      - name: test reviewer and admission controls
        run: >-
          node --test tests/local-review.spec.mjs tests/review-approval.spec.mjs
          tests/review-author-gate.spec.mjs tests/review-pilot.spec.mjs tests/review-status.spec.mjs
      - run: python3 -m pip install -r tools/adversarial_reviewer/requirements.txt
      - run: python3 -m unittest discover -s tools/adversarial_reviewer
      - run: python3 -m unittest discover -s tools/review_routing_research
      - run: python3 tools/review_routing_research/qualify_packing.py
      - run: python3 -m unittest discover -s scripts/release
      - run: python3 scripts/release/lint_workflows.py
  coreml:
    if: inputs.windows_transport_only != true && needs.context.outputs.native_required == 'true'
    timeout-minutes: 30
    needs: context
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12.16'
          version: '0.13.9'
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/savior-python
      - name: restore rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coreml-macos-15-${{ runner.arch }}
          save-if: ${{ inputs.test_sha == '' }}
          cache-on-failure: true
      - name: native build
        run: cargo clippy --locked -p savior --features coreml --all-targets -- -D warnings
      - run: cargo test --locked -p savior --features coreml
      - run: uv run --python 3.12 --with-requirements scripts/requirements-coreml.txt python -m unittest discover -s scripts -p test_coreml_export.py
      - uses: ./.github/actions/model-cache
      - run: |
          uv run --python 3.12 --with-requirements scripts/requirements-coreml.txt scripts/reference.py
          uv run --python 3.12 --with-requirements scripts/requirements-coreml.txt scripts/export-coreml.py --fixed-batch 1 --output .cache/security/coreml-export
          cargo run --locked --release -p savior --example parity
      - env:
          SAVIOR_BENCH_BACKEND: core_ml
          SAVIOR_COREML_DIR: ${{ github.workspace }}/.cache/security/coreml-export
          SAVIOR_COMPUTE_UNITS: cpu_only
        run: cargo run --locked --release -p savior --features coreml --example parity
      - name: summarize cache measurements
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_GROUP: coreml-macos-15-${{ runner.arch }}
          CACHE_JOB: coreml
        with:
          script: |
            await require('./scripts/release/cache-summary.cjs')({github, context, core});
  release-tools:
    if: inputs.windows_transport_only != true && needs.context.outputs.native_required == 'true'
    needs: context
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - run: docker build -f scripts/release/Dockerfile -t savior-release-tools .
      - run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace:ro" --entrypoint python3 savior-release-tools -m unittest discover -s scripts/release
  verification:
    if: always() && inputs.windows_transport_only != true
    needs: [context, tooling, security, coreml, release-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/release/ci_impact.py verification
  windows-transport:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_transport_only == true
    needs: context
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: native-windows-2022-${{ runner.arch }}
          save-if: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo build --locked --release -p savior-review --features judge
      - run: cargo test --locked -p savior-review --features judge windows::transport_tests
      - run: node --test tests/review-transport.spec.mjs tests/review.spec.mjs
