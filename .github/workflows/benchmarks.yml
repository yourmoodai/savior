name: benchmark evidence
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Cases per external dataset (0 for all English cases)
        default: '200'
        required: true
permissions:
  contents: read
jobs:
  benchmark:
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-ubuntu-24.04-${{ runner.arch }}
          cache-on-failure: true
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run bench:build
      - run: npm run bench:test
      - uses: ./.github/actions/model-cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/bench-corpus
          key: benchmark-corpus-v1-${{ runner.os }}-${{ hashFiles('benchmarks/sources.json', 'scripts/bench/corpus.mjs') }}
      - run: npm run corpus:fetch
      - name: measure quality and implementation boundaries
        env:
          BENCH_LIMIT: ${{ inputs.limit }}
        run: npm run bench:all -- --output .cache/battle-ci --limit "$BENCH_LIMIT" --host no
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-evidence
          path: .cache/battle-ci
          if-no-files-found: warn
