name: reviewer cpu routing research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: test research harness
        run: python3 -m unittest discover -s tools/review_routing_research
      - name: qualify packing offline
        run: python3 tools/review_routing_research/qualify_packing.py
      - name: restore verified artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/cpu-router
          key: cpu-router-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/review_routing_research/cpu_model.json', 'tools/review_routing_research/local_model.py') }}
      - name: build cpu runtime and verify model
        run: python3 tools/review_routing_research/run.py setup
      - name: benchmark advisory routing
        run: python3 tools/review_routing_research/run.py benchmark --local-llm --output .cache/cpu-routing-report.json
      - name: preserve research evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-routing-research
          path: |
            .cache/cpu-routing-report.json
            .cache/packing-quality/
            .cache/cpu-router/setup.json
            .cache/cpu-router/server.log
          if-no-files-found: error
