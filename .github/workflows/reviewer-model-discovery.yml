name: reviewer model discovery
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    if: vars.BEDROCK_DISCOVERY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BEDROCK_DISCOVERY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '463509296941'
      - name: discover without inference
        run: python3 tools/adversarial_reviewer/models.py discover > model-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-model-inventory
          path: model-inventory.json
          retention-days: 7
          if-no-files-found: error
