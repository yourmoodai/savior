name: adversarial code review
on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
permissions:
  contents: read
jobs:
  scope:
    timeout-minutes: 15
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/savior review'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      head: ${{ steps.scope.outputs.head }}
      pr: ${{ steps.scope.outputs.pr }}
      base: ${{ steps.scope.outputs.base }}
      enabled: ${{ steps.enabled.outputs.value }}
    steps:
      - id: enabled
        env:
          ENABLED: ${{ vars.BEDROCK_REVIEW_ENABLED }}
        run: echo "value=$ENABLED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: scope
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          BOOTSTRAP_CODEOWNERS: ${{ vars.ADVERSARIAL_BOOTSTRAP_CODEOWNERS }}
          REVIEW_ENABLED: ${{ vars.BEDROCK_REVIEW_ENABLED }}
        with:
          script: |
            await require('./tools/adversarial_reviewer/scope.cjs')({
              github, context, core, enabled:process.env.REVIEW_ENABLED,
              bootstrap:process.env.BOOTSTRAP_CODEOWNERS,
            });
  review:
    timeout-minutes: 120
    name: adversarial verdict
    needs: scope
    if: needs.scope.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: bedrock-review-spending
      cancel-in-progress: false
    environment:
      name: bedrock-review
      deployment: false
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    env:
      HEAD_SHA: ${{ needs.scope.outputs.head }}
      PR_NUMBER: ${{ needs.scope.outputs.pr }}
      BASE_SHA: ${{ needs.scope.outputs.base }}
      AWS_REGION: us-east-1
      BEDROCK_REVIEW_ENABLED: ${{ needs.scope.outputs.enabled }}
      BEDROCK_EXTERNAL_PROBE_NANODOLLARS: ${{ vars.BEDROCK_EXTERNAL_PROBE_NANODOLLARS }}
    steps:
      # Only trusted base code executes with secrets. PR code is diff data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
      - name: update review status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publish = require('./tools/adversarial_reviewer/publish.cjs');
            await publish({github, context, core, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, phase:'waiting'});
      - name: snapshot current test status without waiting
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.scope.outputs.head }}
          PR_NUMBER: ${{ needs.scope.outputs.pr }}
        with:
          script: |
            const snapshot = require('./tools/adversarial_reviewer/test_status.cjs');
            await snapshot({github, context, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, output:process.env.RUNNER_TEMP+'/review-tests.json'});
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: install signing transport
        run: python3 -m pip install -r tools/adversarial_reviewer/requirements.txt
      - name: fetch diff without checkout
        env:
          PR_NUMBER: ${{ needs.scope.outputs.pr }}
        run: git fetch origin "pull/$PR_NUMBER/head"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: restore pilot budget
        if: needs.scope.outputs.enabled == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try { await require('./tools/adversarial_reviewer/pilot.cjs')({github,context}); }
            catch (error) {
              const fs=require('node:fs'); fs.mkdirSync('review-result',{recursive:true});
              fs.writeFileSync('review-result/failure.json',JSON.stringify({reason:'spending_unresolved'}));
              throw error;
            }
      - name: validate spending comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BOOTSTRAP_CODEOWNERS: ${{ vars.ADVERSARIAL_BOOTSTRAP_CODEOWNERS }}
        with:
          script: |
            const handler=require('./tools/adversarial_reviewer/approval.cjs');
            const approval=await handler.record_failure(()=>handler.revalidate({
              github,context,number:process.env.PR_NUMBER,head:process.env.HEAD_SHA,
              base:process.env.BASE_SHA,bootstrap:process.env.BOOTSTRAP_CODEOWNERS,
            }));
            require('node:fs').writeFileSync('review-result/approval.json',JSON.stringify(approval));
      - name: estimate and authorize spending without inference
        id: preflight
        env:
          REVIEW_TEST_EVIDENCE: ${{ runner.temp }}/review-tests.json
        run: python3 tools/adversarial_reviewer/preflight.py
      - name: revalidate before inference
        if: steps.preflight.outputs.spend == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BOOTSTRAP_CODEOWNERS: ${{ vars.ADVERSARIAL_BOOTSTRAP_CODEOWNERS }}
        with:
          script: |
            const handler=require('./tools/adversarial_reviewer/approval.cjs');
            await handler.record_failure(()=>handler.revalidate({
              github,context,number:process.env.PR_NUMBER,head:process.env.HEAD_SHA,
              base:process.env.BASE_SHA,bootstrap:process.env.BOOTSTRAP_CODEOWNERS,
            }));
      - name: persist pilot reservation
        if: steps.preflight.outputs.spend == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haiku45-pilot-20261015-reserved-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-result/reservation.json
          retention-days: 90
          if-no-files-found: error
      - name: assume bedrock review role
        if: steps.preflight.outputs.spend == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BEDROCK_REVIEW_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '463509296941'
          role-duration-seconds: 3600
          role-session-name: savior-review-${{ github.run_id }}
      - name: qualify and assess
        if: steps.preflight.outputs.spend == 'true'
        env:
          BEDROCK_REVIEW_ENABLED: ${{ needs.scope.outputs.enabled }}
          BEDROCK_EXTERNAL_PROBE_NANODOLLARS: ${{ vars.BEDROCK_EXTERNAL_PROBE_NANODOLLARS }}
          BASE_SHA: ${{ needs.scope.outputs.base }}
          HEAD_SHA: ${{ needs.scope.outputs.head }}
          REVIEW_TEST_EVIDENCE: ${{ runner.temp }}/review-tests.json
          REVIEW_BUDGET_GRANT: ${{ steps.preflight.outputs.grant }}
        run: python3 tools/adversarial_reviewer/run_ci.py
      - name: snapshot budget after completion or cancellation
        if: always() && needs.scope.outputs.enabled == 'true' && hashFiles('review-result/ledger.db') != ''
        run: python3 tools/adversarial_reviewer/settle.py review-result
      - name: preserve validated review cache
        if: always() && hashFiles('review-result/cache/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-cache
          path: review-result/cache/*.json
          retention-days: 7
          if-no-files-found: error
      - name: reconcile pilot reservation
        if: always() && needs.scope.outputs.enabled == 'true' && hashFiles('review-result/recovery/settled.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haiku45-pilot-20261015-settled-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review-result/recovery/ledger.db
            review-result/recovery/settled.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adversarial-report
          path: review-result/
          retention-days: 90
          if-no-files-found: error
      - name: identify spending quote
        if: always() && hashFiles('review-result/quote.json') != ''
        id: quote
        run: python3 -c 'import json,os; q=json.load(open("review-result/quote.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("id="+q["id"]+"\n")'
      - name: preserve spending quote
        if: always() && steps.quote.outputs.id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-quote-${{ steps.quote.outputs.id }}
          path: review-result/quote.json
          retention-days: 7
          if-no-files-found: error
      - name: publish verdict
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const report = JSON.parse(require('node:fs').readFileSync('review-result/report.json', 'utf8'));
            const publish = require('./tools/adversarial_reviewer/publish.cjs');
            await publish({github, context, core, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, phase:'complete', report});
            core.setOutput('published', 'true');
        id: verdict
      - name: publish unavailable status
        if: failure() && steps.verdict.outputs.published != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publish = require('./tools/adversarial_reviewer/publish.cjs');
            const fs = require('node:fs');
            const path = process.env.RUNNER_TEMP+'/review-tests.json';
            const evidence = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : undefined;
            await publish({github, context, core, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, phase:'failed', evidence, reason:fs.existsSync('review-result/failure.json') ? JSON.parse(fs.readFileSync('review-result/failure.json','utf8')).reason : undefined});
