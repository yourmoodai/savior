name: site
on:
  workflow_dispatch:
    inputs:
      test_sha:
        description: Commit to test; manual dispatch authorizes testing only
        required: false
        type: string
  workflow_call:
    inputs:
      test_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: site-${{ inputs.test_sha || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: inputs.test_sha != '' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - run: python3 scripts/site.py check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/test-site.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public
