name: dependency security
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      test_sha:
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [npm, rust, python, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.test_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - if: matrix.ecosystem == 'rust'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - if: matrix.ecosystem == 'rust'
        run: cargo install cargo-audit --locked --version 0.23.0
      - if: matrix.ecosystem == 'python'
        run: python3 -m pip install uv==0.13.9
      - if: matrix.ecosystem == 'container'
        run: |
          python3 scripts/security-install.py >> "$GITHUB_PATH"
          docker build -f scripts/release/Dockerfile -t savior-release-tools .
      - run: python3 scripts/security-audit.py "${{ matrix.ecosystem }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ matrix.ecosystem }}
          path: .cache/security/current
          if-no-files-found: error
          retention-days: 7
