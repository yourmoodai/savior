name: installed release qualification
description: Exercise the assembled archive and installed Claude Code host.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: release
        path: .cache/release
    - run: python scripts/release/smoke.py .cache/release
      shell: bash
    # Full host qualification is required before a production release.
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.0
        cache: npm
    - run: npm install --global @anthropic-ai/claude-code@2.1.290
      shell: bash
    - if: runner.os == 'Windows'
      shell: bash
      run: python -m pip install pywinpty==3.0.2
    - name: installed host gate
      shell: bash
      run: python -c "import subprocess, sys; subprocess.run([sys.executable, 'scripts/release/host_gate.py'], check=True, timeout=300)"
