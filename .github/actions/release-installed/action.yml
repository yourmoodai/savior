name: installed release qualification
description: Exercise archive integrity and native runtime acceptance.
inputs:
  native:
    description: Require native signatures and offline macOS first launch
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12.10'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: .cache/release
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.2
    - run: python scripts/release/smoke.py .cache/release ${{ inputs.native == 'true' && '--native' || '' }}
      shell: bash
