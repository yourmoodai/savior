name: installed release qualification
description: Exercise archive integrity and native runtime acceptance.
inputs:
  native:
    description: Require native signatures and offline macOS first launch
    default: 'false'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.12.16'
        version: '0.13.9'
        enable-cache: false
        activate-environment: true
        venv-path: ${{ runner.temp }}/savior-python
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: .cache/release
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.1
    - run: python scripts/release/smoke.py .cache/release ${{ inputs.native == 'true' && '--native' || '' }}
      shell: bash
