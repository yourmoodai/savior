[package]
name = "savior-cli"
default-run = "savior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords = ["privacy", "local-inference", "offline", "open-source-models", "span-replacement"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "savior"
path = "src/main.rs"

[[bin]]
name = "savior-bootstrap"
path = "src/bootstrap.rs"

[dependencies]
base16ct.workspace = true
savior.workspace = true
savior-review = { path = "../review", features = ["watch"] }
serde.workspace = true
serde_json.workspace = true
fs2 = "0.4.3"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
