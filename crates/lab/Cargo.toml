[package]
name = "savior-lab"
default-run = "savior-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords = ["privacy", "local-inference", "offline", "open-source-models", "span-replacement"]
categories = ["development-tools::testing", "text-processing"]

[dependencies]
base16ct.workspace = true
savior = { path = "../core", features = ["training"] }
savior-review = { path = "../review", features = ["judge"] }
serde.workspace = true
serde_json.workspace = true
candle-core = "0.11.1"
candle-nn = "0.11.1"
sha2 = "0.11.1"
clap = { version = "4.6.9", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
