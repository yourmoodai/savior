[package]
name = "savior-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords = ["privacy", "local-inference", "offline", "open-source-models", "span-replacement"]
categories = ["development-tools::testing", "text-processing"]

[features]
judge = ["dep:reqwest", "dep:ctrlc"]
inspector = ["dep:duckdb", "dep:tiny_http"]
watch = ["dep:ctrlc"]

[[bin]]
name = "savior-review"
path = "src/main.rs"
required-features = ["judge"]

[dependencies]
base16ct.workspace = true
savior.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rand = "0.10.4"
hmac = "0.13.0"
fs2 = "0.4.3"
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["blocking", "json", "rustls"] }
ctrlc = { version = "3.5.3", optional = true }
duckdb = { version = "=1.20001.0", optional = true, features = ["bundled", "parquet"] }
tiny_http = { version = "0.12.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
socket2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
